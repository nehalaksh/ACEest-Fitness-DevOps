name: ACEest Fitness CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate Python syntax
        run: python -m compileall -q app.py tests

      - name: Lint
        run: ruff check app.py tests

      - name: Run unit tests
        run: python -m pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        run: docker build --target test -t aceest-fitness:test .

      - name: Test inside Docker
        run: docker run --rm aceest-fitness:test

      - name: Build runtime image
        run: docker build --target runtime -t aceest-fitness:latest .